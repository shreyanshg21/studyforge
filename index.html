<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyForge - AI study platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
</head>
<body>

  <!-- Login screen (only used when Supabase is configured) -->
  <div id="auth" class="auth" hidden>
    <form id="auth-form" class="card stack auth-card">
      <div class="brand"><i data-lucide="graduation-cap"></i> StudyForge</div>
      <h1 id="auth-title">Sign in to your notes</h1>
      <label class="field">Email<input type="email" id="a-email" required autocomplete="email"></label>
      <label class="field">Password<input type="password" id="a-pw" required minlength="6" autocomplete="current-password"></label>
      <p id="a-msg" class="alert" hidden></p>
      <button class="btn" id="a-btn">Sign in</button>
      <button type="button" class="link" id="a-toggle">New here? Create an account</button>
    </form>
  </div>

  <!-- Main app -->
  <div id="app" hidden>
    <div id="backdrop"></div>
    <aside id="sidebar">
      <div class="side-top">
        <a href="#/generate" class="brand"><i data-lucide="graduation-cap"></i><span class="lbl">StudyForge</span></a>
        <button class="icon-btn only-mobile" id="close-menu" aria-label="Close menu"><i data-lucide="x"></i></button>
      </div>
      <nav id="nav"></nav>
      <div class="side-bottom">
        <button class="nav-item" id="logout" hidden><i data-lucide="log-out"></i><span class="lbl">Sign out</span></button>
        <button class="nav-item only-desktop" id="collapse" aria-label="Collapse sidebar"><i data-lucide="panel-left-close"></i><span class="lbl">Collapse</span></button>
      </div>
    </aside>

    <div id="main">
      <header class="topbar">
        <div class="row">
          <button class="icon-btn only-mobile" id="open-menu" aria-label="Open menu"><i data-lucide="menu"></i></button>
          <strong id="title"></strong>
        </div>
        <div class="row">
          <button class="icon-btn" id="key-btn" aria-label="Set Gemini API key" title="Set Gemini API key"><i data-lucide="key-round"></i></button>
          <button class="icon-btn" id="theme" aria-label="Toggle dark mode"><i data-lucide="moon"></i></button>
        </div>
      </header>
      <div id="banner" class="banner" hidden>Local mode: your data stays in this browser. Add Supabase keys in js/config.js to sync across devices and share to the Community Library.</div>
      <main id="view"></main>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <!-- Libraries (pinned versions) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.441.0/dist/umd/lucide.min.js"></script>

  <!-- App (order matters) -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/generate.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/saved.js"></script>
  <script src="js/library.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/flashcards.js"></script>
  <script src="js/summarizer.js"></script>
  <script src="js/trash.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
